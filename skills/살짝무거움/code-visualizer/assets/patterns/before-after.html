<div class="compare-grid" aria-label="{{QUESTION}}">
  <section class="compare-column">
    <p class="group-title">Before · {{BASE_REVISION}}</p>
    <article class="node static {{E1_CLASS}}">
      <span class="node-title">{{BEFORE_OWNER}}</span>
      <span class="node-copy">{{BEFORE_BEHAVIOR}}</span>
      <span class="node-meta"><span class="badge {{E1_CLASS}}">{{E1_LABEL}}</span><span class="badge">{{BEFORE_CHANGE}}</span></span>
    </article>
  </section>
  <section class="compare-column">
    <p class="group-title">After · {{HEAD_REVISION}}</p>
    <article class="node static domain {{E2_CLASS}}">
      <span class="node-title">{{AFTER_OWNER}}</span>
      <span class="node-copy">{{AFTER_BEHAVIOR}}</span>
      <span class="node-meta"><span class="badge {{E2_CLASS}}">{{E2_LABEL}}</span><span class="badge">{{AFTER_CHANGE}}</span></span>
    </article>
  </section>
</div>
